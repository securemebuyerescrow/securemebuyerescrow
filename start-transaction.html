
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Start a Transaction - SecureMeBuyerEscrow</title>
</head>
<body>
    <header>
        <h1>Start a New Escrow Transaction</h1>
    </header>
    <main>
        <form>
            <label for="buyer">Buyer Email:</label><br>
            <input type="email" id="buyer" name="buyer"><br><br>
            <label for="seller">Seller Email:</label><br>
            <input type="email" id="seller" name="seller"><br><br>
            <label for="domain">Domain Name:</label><br>
            <input type="text" id="domain" name="domain"><br><br>
            <label for="amount">Transaction Amount (USD):</label><br>
            <input type="number" id="amount" name="amount"><br><br>
            <input type="submit" value="Start Transaction">
        </form>
    </main>
    <footer>
        <p>&copy; 2024 SecureMeBuyerEscrow</p>
    </footer>
</body>
</html>
